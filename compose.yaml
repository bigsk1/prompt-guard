# CPU service. First start downloads the pinned model into the named volume.
# Publish on a private network. Set PROMPT_GUARD_PUBLISH=127.0.0.1:8080 when
# the only client is a reverse proxy on this host.

name: prompt-guard

services:
  prompt-guard:
    build:
      context: .
      target: cpu
    image: prompt-guard:cpu
    env_file:
      - path: .env
        required: false
    environment:
      PROMPT_GUARD_RUNTIME: onnx
      PROMPT_GUARD_DEVICE: cpu
      PROMPT_GUARD_ONNX_VARIANT: ${PROMPT_GUARD_ONNX_VARIANT:-quantized}
      PROMPT_GUARD_DTYPE: float32
      PROMPT_GUARD_MODEL_CACHE_DIR: /models
      PROMPT_GUARD_HOST: 0.0.0.0
      PROMPT_GUARD_PORT: 8080
      PROMPT_GUARD_API_KEY: ${PROMPT_GUARD_API_KEY:-}
      PROMPT_GUARD_DEFAULT_THRESHOLD: ${PROMPT_GUARD_DEFAULT_THRESHOLD:-0.5}
      PROMPT_GUARD_WINDOW_SIZE: ${PROMPT_GUARD_WINDOW_SIZE:-2048}
      PROMPT_GUARD_WINDOW_OVERLAP: ${PROMPT_GUARD_WINDOW_OVERLAP:-512}
      PROMPT_GUARD_MAX_WINDOWS: ${PROMPT_GUARD_MAX_WINDOWS:-32}
      PROMPT_GUARD_MAX_INPUT_TOKENS: ${PROMPT_GUARD_MAX_INPUT_TOKENS:-32768}
      PROMPT_GUARD_MAX_REQUEST_BYTES: ${PROMPT_GUARD_MAX_REQUEST_BYTES:-1048576}
      PROMPT_GUARD_DEADLINE_MS: ${PROMPT_GUARD_DEADLINE_MS:-30000}
      PROMPT_GUARD_QUEUE_SIZE: ${PROMPT_GUARD_QUEUE_SIZE:-8}
    ports:
      - "${PROMPT_GUARD_PUBLISH:-0.0.0.0:8080}:8080"
    volumes:
      - prompt-guard-models:/models
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  prompt-guard-models:
