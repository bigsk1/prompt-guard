[project]
name = "prompt-guard"
version = "1.0.0"
description = "Self-contained FastAPI service that scores text for prompt injection."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "huggingface-hub==2.3.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "transformers==5.21.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: downloads the pinned model and compares runtimes",
]
